
name: Go CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test and Lint
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./app/go.mod
          cache-dependency-path: ./app/go.sum

      - name: Install linter
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b /tmp/golangci-bin v2.14.0

      - name: Run tests and lint
        run: |
          set -uo pipefail

          go test -race -count=1 -json ./... \
            > test-results.json 2> test-errors.log &
          test_pid=$!

          /tmp/golangci-bin/golangci-lint run \
            > lint.log 2>&1 &
          lint_pid=$!

          result=0

          echo "::group::Tests"
          if wait "$test_pid"; then
            echo "Tests PASSED"
          else
            echo "Tests FAILED"
            result=1
          fi

          cat test-errors.log
          grep -E '"Action":"fail"|WARNING: DATA RACE' \
            test-results.json || true
          echo "::endgroup::"

          echo "::group::Linter"
          if wait "$lint_pid"; then
            echo "Linter PASSED"
          else
            echo "Linter FAILED"
            result=1
          fi

          cat lint.log
          echo "::endgroup::"

          exit "$result"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: go-test-results
          path: ./app/test-results.json
          if-no-files-found: warn
