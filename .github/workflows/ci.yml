
name: Go CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test and Lint
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./app/go.mod
          cache-dependency-path: ./app/go.sum

      - name: Install linter
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b /tmp/golangci-bin v2.14.0


      - name: Run tests and lint
        id: checks
        run: |
          set -uo pipefail

          # Start tests
          test_start=$(date +%s)

          go test -race -count=1 -json ./... \
            > test-results.json 2> test-errors.log &
          test_pid=$!

          # Start linter
          lint_start=$(date +%s)

          /tmp/golangci-bin/golangci-lint run \
            > lint.log 2>&1 &
          lint_pid=$!

          result=0

          # Wait for tests
          if wait "$test_pid"; then
            echo "tests=PASSED" >> "$GITHUB_OUTPUT"
          else
            echo "tests=FAILED" >> "$GITHUB_OUTPUT"
            result=1
          fi

          test_end=$(date +%s)
          echo "test_duration=$((test_end - test_start))" >> "$GITHUB_OUTPUT"

          # Wait for linter
          if wait "$lint_pid"; then
            echo "lint=PASSED" >> "$GITHUB_OUTPUT"
          else
            echo "lint=FAILED" >> "$GITHUB_OUTPUT"
            result=1
          fi

          lint_end=$(date +%s)
          echo "lint_duration=$((lint_end - lint_start))" >> "$GITHUB_OUTPUT"

          cat test-errors.log lint.log

          exit "$result"

      - name: Generate Summary
        if: always()
        env:
          TEST_RESULT: ${{ steps.checks.outputs.tests }}
          TEST_DURATION: ${{ steps.checks.outputs.test_duration }}
          LINT_RESULT: ${{ steps.checks.outputs.lint }}
          LINT_DURATION: ${{ steps.checks.outputs.lint_duration }}
        run: |
          {
            echo "## Go CI Results"
            echo ""
            echo "| Check | Status | Duration |"
            echo "|---|---|---|"
            echo "| Tests | ${TEST_RESULT:-NOT RUN} | ${TEST_DURATION:-N/A}s |"
            echo "| Linter | ${LINT_RESULT:-NOT RUN} | ${LINT_DURATION:-N/A}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: go-test-results
          path: ./app/test-results.json
          if-no-files-found: warn
      
